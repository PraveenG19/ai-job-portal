spring.application.name=backend

server.port=${PORT:8081}

# ── Database ──────────────────────────────────────────────────────────────────
# File-based H2 so data survives restarts (Railway mounts /tmp)
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/ai_job_portal;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ── JWT ───────────────────────────────────────────────────────────────────────
# Must be Base64-encoded, min 32 chars before encoding
jwt.secret=${JWT_SECRET:QUlKb2JQb3J0YWxTZWNyZXRLZXlGb3JKV1RBdXRoMjAyNkFJSm9iUG9ydGFs}
jwt.expiration=86400000

# ── Swagger ───────────────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── File Upload ───────────────────────────────────────────────────────────────
file.upload-dir=uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Email ─────────────────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:abhishektarnalli@gmail.com}
spring.mail.password=${MAIL_PASS:hcciuoygjwuvcf}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Gemini AI ─────────────────────────────────────────────────────────────────
gemini.api.key=${GEMINI_KEY:}

# ── CORS allowed origins (comma-separated, overridden by env var on Railway) ──
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:8081}
